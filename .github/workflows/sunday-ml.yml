# Weekly Sunday Maple foundation-model scores (lib/sunday/ml.ts): feature rows -> TabICL v2 + TabPFN v2 on CPU -> the site.
# Runs a few times Wednesday to Saturday because the Sunday notice usually comes Friday 10:00 KST (Wed / Thu before a
# holiday) and the site's Cron records it within hours. A run with nothing new stops after the first step.
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (read the published weeks, like the pages), ML_UPLOAD_SECRET (the same value
# as on Vercel; it can only post these scores). The database key stays on Vercel.
# GitHub turns scheduled runs off after 60 days without repository activity in a public repository; the pages then
# show the statistical model alone. Run it by hand from the Actions tab to try it (Sunday = optional YYYY-MM-DD).
name: Sunday model scores

on:
  schedule:
    - cron: "40 2 * * 3-6" # Wed-Sat 11:40 KST
    - cron: "40 12 * * 3-6" # Wed-Sat 21:40 KST
  workflow_dispatch:
    inputs:
      sunday:
        description: "Sunday to score (YYYY-MM-DD, empty = the one the pages predict)"
        required: false

permissions:
  contents: read

concurrency:
  group: sunday-ml
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Feature rows
        id: rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUNDAY: ${{ inputs.sunday }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/sunday-ml/export.mjs "$SUNDAY"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.rows.outputs.skip != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: scripts/sunday-ml/uv.lock

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rows.outputs.skip != 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/tabpfn
          key: models-tabicl-classifier-v2-20260212-tabpfn-v2

      - name: Model scores (TabICL + TabPFN)
        if: steps.rows.outputs.skip != 'true'
        run: uv run --project scripts/sunday-ml --frozen python scripts/sunday-ml/predict.py

      - name: Upload
        if: steps.rows.outputs.skip != 'true'
        env:
          SITE_URL: https://maple-dashboard-eta.vercel.app
          ML_UPLOAD_SECRET: ${{ secrets.ML_UPLOAD_SECRET }}
        run: node scripts/sunday-ml/upload.mjs
